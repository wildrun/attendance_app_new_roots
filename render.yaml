services:
  - type: web
    name: attendance-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DEFAULT_SHEET_URL
        sync: false
